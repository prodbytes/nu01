# Deploys a release candidate to https://rc.nu01.com: every pushed tag
# matching *RC* (e.g. 0.1.202610081200-RC, from scripts/release-rc.sh), or a
# manual run. It runs scripts/deploy.sh with STAGE=rc (stack nu01-rc-web),
# which ends by checking that the RC site serves this version and commit.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# nu01-github-deploy-rc role (infra/github-deploy.yaml), which trusts only
# *RC* tag runs and manual runs from main, and may only manage the
# nu01-rc-web stack, its bucket and the rc.nu01.com records. Its ARN is the
# repository variable AWS_DEPLOY_RC_ROLE_ARN.
name: Deploy RC

on:
  push:
    tags:
      - "*RC*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (e.g. 0.1.202610081200-RC). Empty deploys the selected branch's commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-rc
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject the role matches.
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag=""
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag:-the current commit} to rc.nu01.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_RC_ROLE_ARN }}
          role-session-name: nu01-deploy-rc-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ steps.tag.outputs.tag || github.sha }} to RC
        env:
          STAGE: rc
          TAG: ${{ steps.tag.outputs.tag }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
        run: bash scripts/deploy.sh
